server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # ── Hashed JS/CSS assets — 1-year immutable cache ──────────────────
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── WCC site (standalone, deployed at root) ────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
